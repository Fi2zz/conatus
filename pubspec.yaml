name: conatus
description: >-
  时空可组合性（Spatiotemporal Composability）编程范式的 Dart 实现。
  伞包 conatus 再导出 core / foundation / llm / mcp / agent / tasks / tui
  等 14 个模块包，`package:conatus/conatus.dart` 即完整公开 API。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues

environment:
  sdk: ^3.11.0

# glob 只纳入含 pubspec.yaml 的子目录，因此未拉取 conatus_code submodule 的
# clone 也能正常 `dart pub get`。glob 语法需要语言版本 3.11 起。
workspace:
  - packages/*

dependencies:
  conatus_agent: ^0.16.0
  conatus_asr: ^0.16.0
  conatus_compaction: ^0.16.0
  conatus_core: ^0.16.0
  conatus_credentials: ^0.16.0
  conatus_cron: ^0.16.0
  conatus_foundation: ^0.16.0
  conatus_llm: ^0.16.0
  conatus_mcp: ^0.16.0
  conatus_schedule: ^0.16.0
  conatus_search: ^0.16.0
  conatus_skill: ^0.16.0
  conatus_tasks: ^0.16.0
  conatus_tts: ^0.16.0

dev_dependencies:
  conatus_alerting: ^0.16.0
  conatus_browser_use: ^0.16.0
  # 未发布到 pub.dev：声明为 git 源，workspace 内仍解析到本地成员
  # packages/conatus_code；未拉取子模块时按 git 源解析。
  conatus_code:
    git: {url: https://github.com/Fi2zz/conatus_code.git, ref: master}
  conatus_intent: ^0.16.0
  conatus_observability: ^0.16.0
  conatus_team: ^0.16.0
  conatus_workflow: ^0.16.0
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - architecture
  - composability
  - di
  - llm
