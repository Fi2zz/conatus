name: Integration Tests

# 已禁用：不再触发任何 CI 运行（保留文件备查）。
# 重新启用：取消注释下面的 on 块并提交即可。
# on:
#   push:
#   pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Run unit tests
        run: |
          dart test
          for d in packages/*/; do (cd "$d" && dart test); done
      - name: Run integration tests
        run: dart test test/integration/ --reporter=expanded
