name: conatus_rag
description: >-
  conatus 的原始 RAG 能力：会话原文切分、嵌入索引、租户与可见性过滤的
  稠密检索，以及可注入的后端、嵌入与重排契约。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - rag
  - retrieval
  - memory
  - context
