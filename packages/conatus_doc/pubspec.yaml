resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - document
  - patches
  - experimental
