name: conatus_alerting
description: >-
  [实验性] conatus 的告警能力。订阅遥测事件流，检测异常阈值，
  通过控制台 / Webhook / 语音主动通知用户。
version: 0.16.0
publish_to: none # 实验性包暂不发布
repository: https://github.com/Fi2zz/conatus

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: ^0.16.0
  conatus_core: ^0.16.0
  conatus_foundation: ^0.16.0
  conatus_tts: ^0.16.0
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - alerting
  - observability
  - experimental
