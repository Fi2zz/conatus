name: conatus_mcp
description: >-
  conatus 的 MCP（Model Context Protocol）客户端：JSON-RPC 2.0 词汇、
  stdio / HTTP / SSE 三种传输、McpClient 握手与会话，以及把服务端工具
  接入 ToolRegistry 的适配器与装配函数。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}
  conatus_credentials: {path: ../conatus_credentials}
  conatus_foundation: {path: ../conatus_foundation}
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - mcp
  - tools
