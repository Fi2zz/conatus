name: conatus_harness
description: >-
  [实验性] conatus 的可版本化 harness 制品：manifest 数据、Context 子树装配与
  回滚、以及人可读的差异。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 实验性包暂不发布

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: {path: ../conatus_agent}
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - harness
  - experimental
