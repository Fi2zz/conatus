name: conatus_compaction
description: >-
  conatus 的压缩能力缝：滚动摘要的服务契约、压缩交易身份与
  compaction/* 日志事件、工具配对平衡切点，以及一个按预算折叠的默认压缩器。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - compaction
  - session
  - context
