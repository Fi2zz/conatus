name: conatus_workflow
description: >-
  [实验性] conatus 的编排引擎。把多 Agent 协作沉淀为可复用的流程资产。
  API 可能随时变更，不建议在生产环境依赖。
version: 0.1.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 实验性包暂不发布

environment:
  sdk: ^3.6.0

resolution: workspace

# 第 1 步只声明流程定义类型，不引用 conatus_core / conatus_agent /
# conatus_team。待第 4 步引擎落地、conatus_team 进入 workspace 后再补：
#   conatus_agent: ^0.15.0
#   conatus_core: ^0.15.0
#   conatus_team: ^0.15.0
dependencies:

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - workflow
  - agent
