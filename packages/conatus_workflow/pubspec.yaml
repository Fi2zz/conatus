name: conatus_workflow
description: >-
  [实验性] conatus 的编排引擎。把多 Agent 协作沉淀为可复用的流程资产。
  API 可能随时变更，不建议在生产环境依赖。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 实验性包暂不发布

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: {path: ../conatus_agent}
  conatus_alerting: {path: ../conatus_alerting}
  conatus_core: {path: ../conatus_core}
  conatus_cron: {path: ../conatus_cron}
  conatus_foundation: {path: ../conatus_foundation}
  conatus_tasks: {path: ../conatus_tasks}
  conatus_team: {path: ../conatus_team}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - workflow
  - agent
