name: conatus_checkpoint
description: >-
  conatus 的工作区检查点内核：每轮快照、rsync 式恢复、按轮差异读取与检查点
  时间线编排（归档 + 影子 git 两种后端）。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_diff: {path: ../conatus_diff}
  conatus_foundation: {path: ../conatus_foundation}
  crypto: ^3.0.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - checkpoint
  - snapshot
  - workspace
