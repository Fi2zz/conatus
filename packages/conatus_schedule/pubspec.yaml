name: conatus_schedule
description: >-
  conatus 的会话本地持久提醒：提醒写进会话事件流，提供 schedule_create /
  schedule_list / schedule_delete 工具，并在到期后把提醒交付回同一会话。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}
  timezone: ^0.11.0

dev_dependencies:
  conatus_agent: {path: ../conatus_agent}
  conatus_llm: {path: ../conatus_llm}
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - schedule
  - reminder
  - session
