name: conatus_coding
description: >-
  [实验性] conatus 的 coding 场景。代码读写 / 搜索定位复用 conatus_fs_tools，
  本包提供代码执行层（CodeRuntime 接缝 + 子进程后端）与绑定桥接。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: ^0.16.0
  conatus_core: ^0.16.0
  conatus_foundation: ^0.16.0
  conatus_fs_tools: ^0.16.0
  conatus_tasks: ^0.16.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - coding
  - tools
  - plugin
