name: conatus_agent
description: >-
  conatus 的 Agent Loop 与产品化能力：会话/记忆/压缩驱动的多步工具循环，
  以及 plan / sub-agent / reflection / telemetry / evaluation / approval /
  skill / recovery。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_compaction: {path: ../conatus_compaction}
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}
  conatus_llm: {path: ../conatus_llm}
  conatus_schedule: {path: ../conatus_schedule}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - agent
  - llm
  - plugin
