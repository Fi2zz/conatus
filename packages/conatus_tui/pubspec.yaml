  用 Agent Loop 驱动多轮对话与工具调用。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: ^0.16.0
  conatus_compaction: ^0.16.0
  conatus_core: ^0.16.0
  conatus_cron: ^0.16.0
  conatus_foundation: ^0.16.0
  conatus_fs_tools: ^0.16.0
  conatus_llm: ^0.16.0
  conatus_providers: ^0.16.0
  conatus_schedule: ^0.16.0
  conatus_search: ^0.16.0
  conatus_skill: ^0.16.0
  conatus_team: ^0.16.0
  conatus_tts: ^0.16.0
  nocterm: ^0.9.0

dev_dependencies:
  conatus_tasks: ^0.16.0
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - tui
  - agent
  - llm
  - plugin
