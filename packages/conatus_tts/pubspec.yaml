name: conatus_tts
description: >-
  conatus 的 TTS 能力缝：文本到音频的可插拔 TtsProvider（豆包/火山语音合成，
  v3 WebSocket 单向流式），以及可替换的音频输出接口（TtsAudioSink）。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - tts
  - speech
