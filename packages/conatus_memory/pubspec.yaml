name: conatus_memory
description: >-
  conatus 的记忆写入策略能力：一轮结束后决定哪些内容值得长期保留
  （短回复 / 寒暄 / 近重复 / 长度治理）。存储机制在 conatus_foundation 的
  MemoryStore，本包只提供策略与 Agent Loop 的挂载。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: {path: ../conatus_agent}
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}

dev_dependencies:
  conatus_llm: {path: ../conatus_llm}
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - memory
  - agent
  - plugin
