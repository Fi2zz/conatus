name: conatus_fs_tools
description: >-
  [实验性] conatus 的文件系统工具。read_file / write_file / edit_file / rg /
  glob，对齐 DSH 官方 dsh-tool-fs 与搜索工具。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: ^0.16.0
  conatus_core: ^0.16.0
  conatus_foundation: ^0.16.0
  glob: ^2.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - fs
  - tools
  - plugin
