name: conatus_asr
description: >-
  conatus 的 ASR 能力缝：可插拔流式 AsrProvider（豆包/火山 SAUC）、
  transcribe_audio 工具与可替换的音频源（ffmpeg 麦克风采集）。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - asr
  - speech
