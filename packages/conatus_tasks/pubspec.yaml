name: conatus_tasks
description: >-
  conatus 的任务中心（Task Center）：运行时任务追踪中枢。任务由 Agent Loop /
  sub-agent / shell / schedule 自动创建，按任务树（parentTaskId）组织，状态以
  task/changed 事件持久化到会话，提供 list_tasks / cancel_task 工具。
version: 0.16.0
repository: https://github.com/Fi2zz/conatus
issue_tracker: https://github.com/Fi2zz/conatus/issues
publish_to: none # 不再发布 pub.dev：由根包以 git 源统一分发

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  conatus_agent: {path: ../conatus_agent}
  conatus_core: {path: ../conatus_core}
  conatus_foundation: {path: ../conatus_foundation}
  conatus_schedule: {path: ../conatus_schedule}

dev_dependencies:
  conatus_llm: {path: ../conatus_llm}
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - plugin
  - task
  - agent
  - session
