include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  # Flutter 产品（products/conatus_viva）不是 workspace 成员：根解析里没有它的
  # package_config（它自己的依赖用 flutter pub get 在自身目录解析），纳入根分析只会
  # 得到上千条 unresolved import。它由自己的 analysis_options.yaml + flutter analyze
  # 把关，根 CI 不覆盖。纯 Dart 产品（products/conatus_work）是 workspace 成员，
  # 照旧被根分析连带检查。
  exclude:
    - products/conatus_viva/**

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - avoid_redundant_argument_values
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_relative_imports
    - sort_pub_dependencies
    - unnecessary_lambdas
    - use_super_parameters
